<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title></title>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="text/babel">
      function Timer() {
        return <p>타이머 들어갈 곳이지롱!</p>;
      }
      function Message() {
        return <p> 남은시간까지 화이팅이지롱!</p>;
      }
      function Header() {
        return <h1>여기는 헤더지롱!</h1>;
      }
      function Main() {
        return (
          <div>
            <Timer />
            <Message />
          </div>
        );
      }
      function Footer() {
        return <p>여긴 푸터지롱!</p>;
      }
      const app = (
        <div>
          <Header />
          <Main />
          <Footer />
        </div>
      );

      // DOM에 리액트 컴포넌트 랜더링하기
      const domContainer = document.querySelector("#root");
      const root = ReactDOM.createRoot(domContainer);
      root.render(app, domContainer);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
        font-family: "SpoqaHanSansNeo-Regular";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Regular.woff")
          format("woff");
      }
      .grid {
        margin: auto;
        padding: 0;
      }
      .a h2 {
        font-weight: normal;
      }
      .a span {
        font-weight: bold;
      }
      .a p {
        font-weight: bold;
      }
      .a p span {
        font-weight: lighter;
      }
      .b,
      .c {
        position: relative;
        width: 356px;
        height: 205px;
        border-radius: 20px;
        overflow: hidden;
        color: white;
      }
      .b {
        background: url("./b.jpg") center/cover no-repeat;
      }
      .c {
        background: url("./c.jpg") center/cover no-repeat;
      }
      .b::before,
      .c::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #121314cc;
        z-index: 1;
      }
      .b h2,
      .c h2,
      a {
        position: absolute;
        color: #fff;
        z-index: 2;
        margin: 0;
        text-decoration: none;
        font-family: "SpoqaHanSansNeo";
      }
      .b h2,
      .c h2 {
        top: 30px;
        left: 30px;
      }
      .b a,
      .c a {
        bottom: 20px;
        right: 20px;
      }
      @media (max-width: 767px) {
        .grid {
          display: flex;
          flex-direction: column;
          gap: 40px;
          align-items: center;
        }
        .a {
          font-size: 36px;
          gap: 14px;
          margin: 100px 0px 0px 0px;
        }
        .a h2 {
          width: 315px;
          font-size: 36px;
          margin: 0;
        }
        .a p {
          width: 240px;
          font-size: 14px;
        }
        .bc {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
      }
      @media (min-width: 767px) and (max-width: 1919px) {
        .grid {
          display: flex;
          flex-direction: column;
          gap: 40px;
          align-items: center;
        }
        .bc {
          display: flex;
          flex-direction: row;
          gap: 20px;
        }
        .a {
          width: calc(344px * 2 + 20px);
          gap: 20px;
          margin: 100px 0px 0px 0px;
        }
        .a h2 {
          font-size: 70px;
          width: 612px;
          margin: 0;
        }
        .a p {
          font-size: 18px;
          width: 308px;
          line-height: 26px;
          letter-spacing: 0%;
          vertical-align: middle;
        }
      }
      @media (min-width: 1920px) {
        .grid {
          margin-top: 240px;
          width: 1200px;
          display: flex;
          flex-direction: row;

          gap: 102px;
        }
        .a {
          height: 580px;
          gap: 20px;
          margin: 0;
        }
        .a h2 {
          width: 612px;
          font-size: 70px;
          margin-top: 0;
        }
        .a p {
          width: 343px;
          font-size: 20px;
        }
        .bc {
          display: flex;
          flex-direction: column;
          height: 580px;
          gap: 20px;
        }
        .b,
        .c {
          width: 486px;
          height: 280px;
          padding: 40px;
        }
        .b h2,
        .c h2 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="a">
        <h2>
          위니브에서<br />
          <span>함께 콘텐츠 제작하실 분을 모십니다.</span>
        </h2>
        <p>
          위니브
          <span>
            는 ICT 연구 및 (코딩)교육 기관이며 다양한 사회 공헌 활동을 하고
            있습니다.
          </span>
        </p>
      </div>
      <div class="bc">
        <div class="b">
          <h2>IT 교육 영상 콘텐츠</h2>
          <a href="#">바로가기 <img src="./Stroke.svg" alt="" /></a>
        </div>
        <div class="c">
          <img src="./Rectangle 3.png" alt="" />
          <h2>IT 서적</h2>
          <a href="#">바로가기 <img src="./Stroke.svg" alt="" /></a>
        </div>
      </div>
    </div>
  </body>
</html>

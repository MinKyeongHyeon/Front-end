<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello world 출력하기</title>
    <script src="./001.js"></script>
  </head>
  <body>
    <!-- 스크립트는 HTML 문서의 <head> 또는 <body> 태그 내에 작성할 수 있습니다.
    <script> 태그를 사용하여 JavaScript 코드를 작성합니다.
    link가 아니라 script src를 사용하여 외부 JavaScript 파일을 불러올 수 있습니다. -->
    <!-- 초보때는 콘솔창에 찍어서 잘 진행되는지 확인하면서 진행합시다 -->

    <h1>콘솔창 찍어보기 <span>HELLO, WORLD</span></h1>
    <h1>나는 두번째 H1 이다. <strong>Second h1</strong></h1>
    <script src="./001-b.js">
      // 이 부분에는 스크립트를 작성할 수 없음. 이미 스크립트가 호출되어있기 때문임.
    </script>
    <script>
      console.log('003');
      console.log(document.getElementsByTagName('h1'));
      console.log(document.getElementsByTagName('h1')[0]);
      console.log(document.getElementsByTagName('h1')[0].textContent);
      console.log(document.getElementsByTagName('h1')[0].innerHTML);
      console.log(document.getElementsByTagName('h1')[1].textContent);
      console.log(document.getElementsByTagName('h1')[1].innerHTML);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review</title>
    <style>
      button:hover {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <h1 class="title">DOM EVENT</h1>
    <button type="button" id="btn1">마우스를 올려보세요</button>

    <script>
      // 1) 버튼에 마우슬를 올리면 '마우스를 올려보세요'텍스트를 '마우스 IN'으로 변경
      // 마우스를 치우면 원래의 글자로 변경

      const btn1 = document.getElementById('btn1');
      const btn2 = document.getElementById('btn2');

      function mouseControl(el) {
        const defaultMsg = el.textContent;
        el.addEventListener('mouseleave', e => {
          e.target.textContent = defaultMsg;
        });
        el.addEventListener('mouseover', e => {
          e.target.textContent = '마우스 IN';
        });
      }
      mouseControl(btn1);
      mouseControl(btn2);
    </script>
  </body>
</html>
